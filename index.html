<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/hardcode/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Learn the syntax for different programming langauges">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HardCode Academy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HardCode Academy</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = "2749359016" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    // HardCode Academy State & Event Telemetry Bridge for UI Simulation
    window.__HARDCODE_EVENT_LOG__ = [];
    window.__getHardcodeState = function() {
      const semanticNode = document.querySelector('[aria-label*="questionType"], [aria-label*="phase"]');
      if (semanticNode) {
        try {
          return JSON.parse(semanticNode.getAttribute('aria-label'));
        } catch(e) {}
      }
      const buttons = Array.from(document.querySelectorAll('button, [role="button"]')).map(b => (b.innerText || b.getAttribute('aria-label') || '').trim()).filter(Boolean);
      const is3DActive = !!document.querySelector('[aria-label*="Knowledge Graph"], [aria-label*="3D Knowledge Graph"], [aria-label*="Constellation"]');
      const isMounted = document.querySelector('flt-glass-pane') !== null || document.querySelector('canvas') !== null;
      return {
        phase: isMounted ? "ACTIVE" : "INITIALIZING",
        availableButtons: buttons,
        is3DActive: is3DActive,
        eventCount: window.__HARDCODE_EVENT_LOG__.length
      };
    };
    window.addEventListener('error', function(e) {
      if (e && e.message && e.message.trim() && e.message !== 'Script error.' && e.message !== 'Uncaught ') {
        window.__HARDCODE_EVENT_LOG__.push({ type: 'UNHANDLED_ERROR', message: e.message, time: Date.now() });
      }
    });
  </script>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
