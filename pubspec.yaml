name: multiprogramming
description: Learn the syntax for different programming languages
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.3.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ">=6.1.0 <7.0.0"
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/knowledge_graph.json
    - assets/db.json
